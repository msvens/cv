<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Pre-paint: apply a stored dark choice before first render, so dark users see no
			// light flash. Mirrors theme.svelte.ts: only an explicit 'dark' darkens; the default
			// is light. Tailwind's documented pattern for class-based dark mode.
			try {
				if (localStorage.getItem('theme') === 'dark') {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {
				/* storage unavailable: stay light */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
